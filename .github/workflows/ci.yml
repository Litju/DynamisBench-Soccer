name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen
      - name: Environment guard
        run: uv run dbs env-check
      - name: No data or oversized files in Git
        run: uv run dbs repo-check
      - name: Dataset manifests are valid
        run: |
          shopt -s nullglob
          manifests=(data/manifests/*.json)
          if [ ${#manifests[@]} -gt 0 ]; then uv run dbs data validate "${manifests[@]}"; fi
      - name: Evidence registry
        run: |
          uv run dbs registry validate
          uv run dbs registry contested --check
      - name: Ontology, coverage matrix and decision boundaries
        run: |
          uv run dbs ontology validate
          uv run dbs ontology matrix --check
      - name: Signal schema
        run: uv run dbs signals schema --check
      - name: QC rules
        run: |
          uv run dbs qc validate
          uv run dbs qc rules --check
      - name: Device-family qualification parity
        run: |
          uv run dbs qualification validate
          uv run dbs qualification ledger --check
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Install Linux sandbox for the RES-737 development-only controls
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if ! unshare -Ur true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
      - name: Verify timing engines from the installed wheel
        run: |
          uv export --frozen --no-emit-project --quiet -o "$RUNNER_TEMP/wheel-requirements.txt"
          uv venv "$RUNNER_TEMP/wheel-venv"
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          uv pip install --python "$wheel_bin/python" --require-hashes -r "$RUNNER_TEMP/wheel-requirements.txt"
          uv pip install --python "$wheel_bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_bin/python" -c 'import sys; from pathlib import Path; from dynamisbench_soccer import engines; assert Path(engines.__file__).is_relative_to(sys.prefix)'
          "$wheel_bin/dbs" timing gates --help
          "$wheel_bin/dbs" timing contact --help
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_timing_gates.py" "$GITHUB_WORKSPACE/tests/test_timing_contact.py" "$GITHUB_WORKSPACE/tests/test_timing_provenance.py"
      - name: RES-676 installed-wheel registry, admission and private custody
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_m4_task_registry.py" "$GITHUB_WORKSPACE/tests/test_m4_admission.py"
      - name: RES-678 formal offline trial and grading controls from the installed wheel
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/test_m4_grader.py" \
            "$GITHUB_WORKSPACE/tests/test_m4_execution.py" "$GITHUB_WORKSPACE/tests/test_m4_trials.py"
      - name: RES-704 M5 task projection and scientific replay from the installed wheel
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/python" -I -c 'import sys; from pathlib import Path; from dynamisbench_soccer.m4 import measurement; assert Path(measurement.__file__).is_relative_to(sys.prefix)'
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_m5_measurement.py"
      - name: RES-737 offline development-only installed-wheel smoke
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/python" -I -m dynamisbench_soccer.m4.demo > "$RUNNER_TEMP/m4-development.json"
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_m4_contracts.py" "$GITHUB_WORKSPACE/tests/test_m4_runner.py" "$GITHUB_WORKSPACE/tests/test_m4_demo.py"
      - name: RES-697 Nordic and hip installed-wheel processing
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/dbs" nordic-hip process --help
          "$wheel_bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/test_nordic_hip.py" "$GITHUB_WORKSPACE/tests/test_hip_policy_a.py"
      - name: RES-701 IMU installed-wheel processing
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/dbs" imu process --help
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_imu_engine.py"
      - name: RES-671 jump assessment installed-wheel processing
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/dbs" assess jump --help
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_jump_assessment.py"
      - name: RES-672 isometric assessment installed-wheel processing
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/dbs" assess isometric --help
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_isometric_assessment.py"
      - name: RES-673 sprint and COD assessment installed-wheel processing
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/dbs" assess sprint-fv --help
          "$wheel_bin/dbs" assess cod --help
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_sprint_cod_assessment.py"
      - name: RES-703 cross-device agreement installed-wheel processing
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/dbs" agreement run --out "$RUNNER_TEMP/agreement.json"
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_cross_device_agreement.py"
      - name: RES-702 admission contract installed-wheel check
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$GITHUB_WORKSPACE"
          "$wheel_bin/dbs" qualification admit tests/fixtures/admission/candidate.toml
      - name: RES-675 end-to-end matrix from the installed wheel (all eight device families)
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_end_to_end_qualification.py" -q
      - name: RES-675 computed gate, frozen interface and report freshness
        run: |
          uv run dbs qualification validate
          uv run dbs qualification ledger --check
          uv run dbs qualification interface
          uv run python scripts/build_verification.py --check
          uv run python scripts/issue_receipts.py --check
          uv run python scripts/bind_audit.py --check
          uv run dbs qualification states > "$RUNNER_TEMP/states.json" || test $? -eq 1
      - name: RES-700 GNSS and LPS installed-wheel processing
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          cd "$RUNNER_TEMP"
          "$wheel_bin/dbs" gnss-lps process --help
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_gnss_lps_acquisition.py" "$GITHUB_WORKSPACE/tests/test_gnss_lps_processing.py"
      - name: RES-699 installed-wheel processing
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          (cd "$RUNNER_TEMP" && "$wheel_bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/test_radar_laser_acquisition.py" \
            "$GITHUB_WORKSPACE/tests/test_radar_laser_processing.py")
          uv run python - <<'PY'
          from pathlib import Path
          from dynamisbench_soccer.reference.exporters import export_case
          export_case("radar_laser.radar", hz=47).write(Path("/tmp/res699-wheel-radar"))
          export_case("radar_laser.laser", hz=256).write(Path("/tmp/res699-wheel-laser"))
          PY
          uv venv .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/dbs radar-laser process /tmp/res699-wheel-radar/observation --stage native --correction declared_fixed_angle --out /tmp/res699-wheel-radar/result.json
          .wheel-venv/bin/dbs radar-laser process /tmp/res699-wheel-laser/observation --stage native --derivative five_point --out /tmp/res699-wheel-laser/result.json
          .wheel-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          for kind, quantity in (("radar", "velocity"), ("laser", "distance")):
              report = json.loads(Path(f"/tmp/res699-wheel-{kind}/result.json").read_text())
              assert report["native_quantity"] == quantity
              assert report["peak_velocity_m_s"] > 0
          PY
      - name: Installed wheel force-platform processing
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          (cd "$RUNNER_TEMP" && "$wheel_bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/test_force_platform_policy_a.py")
          uv run python -I - <<'PYCODE'
          import os
          import tempfile
          from pathlib import Path
          import sys
          import numpy as np
          wheel = next(Path("dist").glob("*.whl")).resolve()
          sys.path.insert(0, str(wheel))
          from dynamisbench_soccer.engines.force_platform import process
          from dynamisbench_soccer.engines.force_platform_acquisition import PlateSpec
          from dynamisbench_soccer.signals.schema import BundleMeta, ChannelSpec, Device, Geometry
          from dynamisbench_soccer.signals.schema import Protocol, Provenance, Sampling, Session
          from dynamisbench_soccer.signals.schema import SignalBundle, Subject
          from dynamisbench_soccer.data.manifest import DataCategory
          assert str(wheel) in process.__code__.co_filename
          meta = BundleMeta(bundle_id="wheel-smoke", kind="timeseries", test_id="imtp",
              data_category=DataCategory.SYNTHETIC, subject=Subject(pseudonym="SYNTHETIC"),
              session=Session(session_id="wheel", date="2000-01-01"),
              device=Device(device_class="force_plate"), protocol=Protocol(protocol_id="wheel.imtp"),
              sampling=Sampling(nominal_hz=1000), n_rows=1501,
              channels=[ChannelSpec(name="fz", quantity="force", unit="N", plate=1, axis="z")],
              geometry=Geometry(plate_layout="single"), provenance=Provenance(created_by="wheel-check"))
          with tempfile.TemporaryDirectory() as directory:
              os.chdir(directory)
              result = process(SignalBundle(meta, {"fz": np.full(1501, 75*9.80665)}),
                  plates=(PlateSpec(plate=1, assume_field_axes=True),))
              assert abs(result.mass_kg-75)<1e-10
              assert len(result.qc)>0
              assert result.onset.index is None
          PYCODE
      - name: Built wheel LPT/encoder registration, processing and QC rules
        run: |
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          (cd "$RUNNER_TEMP" && "$wheel_bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/test_encoder_policy_a.py" \
            "$GITHUB_WORKSPACE/tests/test_lpt_acquisition.py" "$GITHUB_WORKSPACE/tests/test_lpt_engine.py")
          uv run python -I - <<'PYCODE'
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl")).resolve()
          assert "dynamisbench_soccer/qc/rules.toml" in ZipFile(wheel).namelist()
          sys.path.insert(0, str(wheel))
          from dynamisbench_soccer.cli import build_parser
          from dynamisbench_soccer.engines.lpt import process

          assert str(wheel) in process.__code__.co_filename
          assert "lpt-encoder" in build_parser().format_help()
          PYCODE
