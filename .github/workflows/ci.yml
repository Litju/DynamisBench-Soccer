name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen
      - name: Environment guard
        run: uv run dbs env-check
      - name: No data or oversized files in Git
        run: uv run dbs repo-check
      - name: Dataset manifests are valid
        run: |
          shopt -s nullglob
          manifests=(data/manifests/*.json)
          if [ ${#manifests[@]} -gt 0 ]; then uv run dbs data validate "${manifests[@]}"; fi
      - name: Evidence registry
        run: |
          uv run dbs registry validate
          uv run dbs registry contested --check
      - name: Ontology, coverage matrix and decision boundaries
        run: |
          uv run dbs ontology validate
          uv run dbs ontology matrix --check
      - name: Signal schema
        run: uv run dbs signals schema --check
      - name: QC rules
        run: |
          uv run dbs qc validate
          uv run dbs qc rules --check
      - name: Device-family qualification parity
        run: |
          uv run dbs qualification validate
          uv run dbs qualification ledger --check
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
      - name: Verify timing engines from the installed wheel
        run: |
          uv export --frozen --no-emit-project --quiet -o "$RUNNER_TEMP/wheel-requirements.txt"
          uv venv "$RUNNER_TEMP/wheel-venv"
          wheel_bin="$RUNNER_TEMP/wheel-venv/bin"
          uv pip install --python "$wheel_bin/python" --require-hashes -r "$RUNNER_TEMP/wheel-requirements.txt"
          uv pip install --python "$wheel_bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_bin/python" -c 'import sys; from pathlib import Path; from dynamisbench_soccer import engines; assert Path(engines.__file__).is_relative_to(sys.prefix)'
          "$wheel_bin/dbs" timing gates --help
          "$wheel_bin/dbs" timing contact --help
          "$wheel_bin/python" -m pytest "$GITHUB_WORKSPACE/tests/test_timing_gates.py" "$GITHUB_WORKSPACE/tests/test_timing_contact.py"
      - name: RES-699 installed-wheel processing
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from dynamisbench_soccer.reference.exporters import export_case
          export_case("radar_laser.radar", hz=47).write(Path("/tmp/res699-wheel-radar"))
          export_case("radar_laser.laser", hz=256).write(Path("/tmp/res699-wheel-laser"))
          PY
          uv venv .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/dbs radar-laser process /tmp/res699-wheel-radar/observation --stage native --correction declared_fixed_angle --out /tmp/res699-wheel-radar/result.json
          .wheel-venv/bin/dbs radar-laser process /tmp/res699-wheel-laser/observation --stage native --derivative five_point --out /tmp/res699-wheel-laser/result.json
          .wheel-venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          for kind, quantity in (("radar", "velocity"), ("laser", "distance")):
              report = json.loads(Path(f"/tmp/res699-wheel-{kind}/result.json").read_text())
              assert report["native_quantity"] == quantity
              assert report["peak_velocity_m_s"] > 0
          PY
