name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (frozen lockfile)
        run: uv sync --frozen
      - name: Environment guard
        run: uv run dbs env-check
      - name: No data or oversized files in Git
        run: uv run dbs repo-check
      - name: Dataset manifests are valid
        run: |
          shopt -s nullglob
          manifests=(data/manifests/*.json)
          if [ ${#manifests[@]} -gt 0 ]; then uv run dbs data validate "${manifests[@]}"; fi
      - name: Evidence registry
        run: |
          uv run dbs registry validate
          uv run dbs registry contested --check
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
