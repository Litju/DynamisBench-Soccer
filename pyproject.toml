[project]
name = "dynamisbench-soccer"
version = "0.0.1"
description = "AI/LLM-agent benchmark for neuromuscular performance testing in association football (soccer)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-CONTENT.md"]
authors = [{ name = "Julio Rodriguez" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17.0",
    "pydantic>=2.8",
]

[project.scripts]
dbs = "dynamisbench_soccer.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamisbench_soccer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "memory_bounded: test must run within the 8 GB host budget (peak RSS asserted where relevant)",
]
