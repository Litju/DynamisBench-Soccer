# Force-plate jump processing and metrics (CMJ, SJ, single-leg CMJ)

[[claim]]
id = "FP-001"
subjects = ["cmj", "sj", "force_plate_processing"]
metrics = ["jump_height.takeoff_velocity", "takeoff_velocity"]
kind = "definition"
statement = "Jump height by the impulse-momentum (take-off velocity) method is h = v_to^2 / (2 g), where v_to is centre-of-mass velocity at take-off obtained by integrating net vertical force divided by body mass."
sources = ["linthorne2001", "moir2008"]
evidence_grade = "B"

[[claim]]
id = "FP-002"
subjects = ["cmj", "sj", "dj", "force_plate_processing"]
metrics = ["jump_height.flight_time", "flight_time"]
kind = "definition"
statement = "Jump height by the flight-time method is h = g * t_flight^2 / 8, which assumes the centre of mass is at the same height at take-off and landing; changes in landing posture bias the estimate."
sources = ["linthorne2001", "moir2008"]
evidence_grade = "B"

[[claim]]
id = "FP-003"
subjects = ["cmj", "sj", "force_plate_processing"]
metrics = ["jump_height.takeoff_velocity", "jump_height.flight_time"]
kind = "method"
statement = "Take-off-velocity and flight-time jump heights are different estimands that do not agree exactly; the method must be reported and the two must not be compared or substituted without stating it."
sources = ["moir2008"]
evidence_grade = "B"

[[claim]]
id = "FP-004"
subjects = ["cmj", "sj", "imtp", "force_plate_processing"]
metrics = ["body_weight"]
kind = "method"
statement = "System weight is estimated from a quiet-standing period before movement; errors in the body-weight estimate propagate through integration into take-off velocity and impulse-method jump height."
sources = ["street2001", "owen2014"]
evidence_grade = "B"

[[claim]]
id = "FP-005"
subjects = ["cmj", "force_plate_processing"]
metrics = ["movement_onset"]
kind = "method"
statement = "Movement onset is commonly defined as the first sample where force deviates from system weight by more than five standard deviations of the quiet-standing force, with the onset then backdated; other onset definitions exist and are defensible."
sources = ["owen2014", "mcmahon2018"]
evidence_grade = "B"
contested = true
variants = ["5sd_threshold", "reverse_scan", "first_derivative", "absolute_newton_threshold"]

[[claim]]
id = "FP-006"
subjects = ["cmj", "force_plate_processing"]
metrics = ["unweighting_duration", "braking_duration", "propulsion_duration"]
kind = "method"
statement = "The onset threshold chosen changes CMJ phase durations, so phase-duration metrics are only comparable when the onset method is the same and declared."
sources = ["ijesab_onset2024"]
evidence_grade = "C"
contested = true
variants = ["5sd_threshold", "relative_threshold", "absolute_newton_threshold"]

[[claim]]
id = "FP-007"
subjects = ["cmj", "force_plate_processing"]
metrics = ["movement_onset"]
kind = "method"
statement = "Derivative-based onset detection is less sensitive to variation during the quiet phase than a fixed SD threshold, but the force signal must be low-pass filtered before differentiation to avoid amplifying high-frequency noise."
sources = ["onset_methods2024"]
evidence_grade = "C"
contested = true
variants = ["first_derivative_filtered", "5sd_threshold"]

[[claim]]
id = "FP-008"
subjects = ["cmj", "force_plate_processing"]
metrics = ["sampling_rate"]
kind = "method"
statement = "In one 2026 study, CMJ metrics computed from 2400 Hz recordings resampled to 1200 Hz and 600 Hz showed no statistically significant differences; time-critical variables (contact times, early RFD windows) remain more sensitive to low sampling rates."
sources = ["aleksic2026", "maffiuletti2016"]
population = { level = "recreationally trained" }
evidence_grade = "C"

[[claim]]
id = "FP-009"
subjects = ["cmj", "sj", "force_plate_processing"]
metrics = ["velocity", "displacement"]
kind = "method"
statement = "Velocity and displacement are obtained by numerical forward integration (e.g. trapezoidal rule) of net acceleration from a starting point where velocity is assumed zero during quiet standing."
sources = ["chavda2018", "linthorne2001"]
evidence_grade = "B"
contested = true
variants = ["trapezoid", "simpson", "rectangle"]

[[claim]]
id = "FP-010"
subjects = ["cmj", "force_plate_processing"]
metrics = ["phase_boundaries"]
kind = "definition"
statement = "The CMJ force-time curve is divided into weighing, unweighting, braking (eccentric deceleration), propulsion, flight and landing phases, with boundaries defined from force, velocity and displacement events."
sources = ["mcmahon2018"]
evidence_grade = "B"
contested = true
variants = ["velocity_zero_crossing_boundaries", "force_crossing_boundaries"]

[[claim]]
id = "FP-011"
subjects = ["cmj", "force_plate_processing"]
metrics = ["peak_power", "mean_power"]
kind = "definition"
statement = "Mechanical power in the CMJ is computed as instantaneous vertical force multiplied by centre-of-mass velocity from forward integration; this force-plate method served as a criterion for peak power."
sources = ["owen2014"]
evidence_grade = "B"

[[claim]]
id = "FP-012"
subjects = ["cmj", "force_plate_processing"]
metrics = ["rsi_modified"]
kind = "definition"
statement = "Reactive strength index modified (RSImod) is jump height divided by time to take-off (from movement onset to take-off); the jump-height estimand must be stated."
sources = ["ebben2010"]
evidence_grade = "B"

[[claim]]
id = "FP-013"
subjects = ["cmj", "force_plate_processing"]
metrics = ["flight_time_contraction_time_ratio", "contraction_time"]
kind = "sensitivity"
statement = "Alternative CMJ variables such as flight time to contraction time ratio can detect acute neuromuscular fatigue when jump height or output alone shows little change, reflecting altered jump strategy."
sources = ["gathercole2015"]
evidence_grade = "B"

[[claim]]
id = "FP-014"
subjects = ["cmj", "soccer_context"]
metrics = ["jump_height"]
kind = "sensitivity"
statement = "A meta-analysis found the CMJ useful for monitoring neuromuscular status, with the average of several jumps more sensitive to fatigue and supercompensation than the single best jump."
sources = ["claudino2017"]
evidence_grade = "A"

[[claim]]
id = "FP-015"
subjects = ["cmj", "reliability_stats"]
metrics = ["jump_height", "peak_force", "peak_power", "flight_time"]
kind = "reliability"
statement = "Reliability differs between CMJ variables; many output variables are reliable but some (particularly time- and rate-based) are not, so reliability must be established per variable before interpreting change."
sources = ["cormack2008"]
evidence_grade = "B"

[[claim]]
id = "FP-016"
subjects = ["cmj", "force_plate_processing"]
metrics = ["jump_height", "peak_force", "braking_impulse"]
kind = "validity"
statement = "Portable force plates can show concurrent validity with laboratory plates for vertical jump force-time characteristics, but agreement must be verified for each device and variable."
sources = ["lake2018"]
evidence_grade = "B"

[[claim]]
id = "FP-017"
subjects = ["cmj", "force_plate_processing"]
metrics = ["braking_impulse", "propulsive_impulse", "net_impulse"]
kind = "definition"
statement = "Net impulse is the time integral of (force minus system weight); impulse over the braking and propulsion phases determines centre-of-mass velocity change in each phase."
sources = ["linthorne2001", "mcmahon2018"]
evidence_grade = "B"

[[claim]]
id = "FP-018"
subjects = ["cmj", "force_plate_processing"]
metrics = ["takeoff_instant", "landing_instant"]
kind = "method"
statement = "Take-off and landing are detected by force crossing a threshold near zero (unloaded plate); the threshold definition changes flight time and must be declared."
sources = ["mcmahon2018", "chavda2018"]
evidence_grade = "B"
contested = true
variants = ["fixed_newton_threshold", "k_sd_unloaded_plate", "system_weight_drop"]

[[claim]]
id = "FP-019"
subjects = ["cmj", "sj"]
metrics = ["jump_height"]
kind = "definition"
statement = "The squat jump starts from a static semi-squat without countermovement, so it has no unweighting or braking phase; any countermovement before take-off invalidates the trial."
sources = ["mcmahon2018", "linthorne2001"]
evidence_grade = "B"

[[claim]]
id = "FP-020"
subjects = ["slcmj", "asymmetry"]
metrics = ["jump_height", "peak_force"]
kind = "method"
statement = "Unilateral jump tests such as the single-leg CMJ are used to quantify inter-limb differences, but the asymmetry formula used must be stated because different equations produce different values."
sources = ["bishop2018"]
evidence_grade = "B"
