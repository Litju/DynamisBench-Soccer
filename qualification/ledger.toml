# --------------------------------------------------------------------------------------
# Assessment science engines (dimensions G and H): protocol -> scientific quantities.

[[assessment]]
id = "jumps"
name = "Jumps: CMJ, SJ, single-leg CMJ, drop jump, 10/5"
issue = "RES-671"
tests = ["cmj", "sj", "slcmj", "dj", "rj_10_5"]
device_families = ["force_platform", "lpt_encoder", "timing_contact", "imu"]

[[assessment]]
id = "isometric_dynamometry"
name = "Isometric and dynamometry: IMTP, Nordic, hip squeeze, isometric hamstring"
issue = "RES-672"
tests = ["imtp", "nhe", "hip_add_abd", "iso_ham"]
device_families = ["force_platform", "load_cell_isometric", "nordic_hip"]

[[assessment]]
id = "sprint_cod"
name = "Sprint, sprint F-V profile and change of direction"
issue = "RES-673"
tests = ["sprint_gates", "sprint_fv", "cod_505", "ift_30_15", "rsa"]
device_families = ["timing_contact", "radar_laser", "gnss_lps"]

# --------------------------------------------------------------------------------------
# Declared non-equivalences (dimension L). No interchangeability is assumed.

[[non_equivalence]]
id = "NE-001"
a = "gnss_lps:speed.gnss"
b = "radar_laser:velocity.radar"
statement = "GNSS-derived speed is not equivalent to a radar velocity trace: rates, smoothing, latency and the body point all differ."
study = "RES-703"

[[non_equivalence]]
id = "NE-002"
a = "lpt_encoder:displacement.cable"
b = "force_platform:displacement.com_vertical"
statement = "LPT cable displacement is not vertical centre-of-mass or barbell displacement unless the cable geometry is declared and the attachment point's motion relative to the body is accounted for."
study = "RES-703"

[[non_equivalence]]
id = "NE-003"
a = "lpt_encoder:power.lpt"
b = "force_platform:power.force_plate"
statement = "LPT power (mass x acceleration x velocity at the attachment point) and force-plate power (GRF x COM velocity) are different estimands."
study = "RES-703"

[[non_equivalence]]
id = "NE-004"
a = "timing_contact:flight_time.contact_mat"
b = "force_platform:flight_time.force_plate"
statement = "Contact-mat flight time includes switching latency and threshold differences, so it is not force-plate flight time without an agreement study."
study = "RES-703"

[[non_equivalence]]
id = "NE-005"
a = "imu:flight_time.imu"
b = "force_platform:flight_time.force_plate"
statement = "IMU flight time depends on mounting site and event thresholds, so it is not force-plate flight time without an agreement study."
study = "RES-703"

[[non_equivalence]]
id = "NE-006"
a = "load_cell_isometric:peak_force.imtp_rig"
b = "force_platform:peak_force.imtp_plate"
statement = "IMTP peak force on a load-cell rig and on a force plate differ in rig compliance, body-weight handling and onset detection."
study = "RES-703"

[[non_equivalence]]
id = "NE-007"
a = "timing_contact:split_time.gates"
b = "radar_laser:split_time.derived"
statement = "Gate splits are triggered by the first body part to break the beam; radar- or laser-derived splits track a body point. They are not interchangeable."
study = "RES-703"

[[non_equivalence]]
id = "NE-008"
a = "radar_laser:velocity.radar_doppler"
b = "radar_laser:velocity.laser_differentiated"
statement = "Radar Doppler velocity and velocity differentiated from laser distance have different noise models and processing."
study = "RES-703"

[[non_equivalence]]
id = "NE-009"
a = "gnss_lps:speed.doppler"
b = "gnss_lps:speed.positional"
statement = "Device Doppler speed and speed differentiated from positions are separate estimands, and both depend on vendor filtering."
study = "RES-703"

[[non_equivalence]]
id = "NE-010"
a = "nordic_hip:force.vendor_corrected"
b = "nordic_hip:force.raw_cell"
statement = "Vendor-corrected Nordic or squeeze force is not raw cell force; commercial force and torque definitions are not interchangeable between vendors."
study = "RES-703"
