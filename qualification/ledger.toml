# Device-family qualification ledger (RES-692).
#
# One record per in-scope measurement-device family, and one record per qualification
# dimension A-O. Family states are COMPUTED from these records by
# `dbs qualification validate`; they are never declared by hand.
#
# Dimension states: absent < partial < specified < verified.
# Evidence kinds `adapter_import` and `vendor_reproduction` are recorded for
# transparency but never count towards any dimension.
# Blocker kinds: `dependency` (engineering work owned by another issue) and
# `scientific` (missing source, data or evidence; may not be resolvable).
#
# Rendered as docs/qualification-ledger.md by `dbs qualification ledger --write`.

version = "0.1.0"

[admission]
issue = "RES-702"
rule = "A new device class enters only through a versioned scientific evidence contract covering dimensions A-O. It starts with scope 'proposed', has no task cells and no grading, and cannot exceed SPECIFIED until it is approved into scope."

# --------------------------------------------------------------------------------------
# Quality-parity principles

[[principle]]
id = "QP-01"
text = "Every in-scope device family is held to the same qualification dimensions A-O. Parity is in qualification quality, not in identical algorithms."
enforced_by = "Every family must list all fifteen dimensions (schema)."

[[principle]]
id = "QP-02"
text = "Family qualification states are computed from dimension evidence, never declared. A hand-set label that disagrees with the computed state fails."
enforced_by = "compute_state(); declared_state check in validate()."

[[principle]]
id = "QP-03"
text = "Importing a CSV correctly or reproducing vendor-reported numbers never qualifies any dimension."
enforced_by = "adapter_import and vendor_reproduction evidence are non-counting."

[[principle]]
id = "QP-04"
text = "No reference may validate itself. A reference produced by the same implementation as the engine it verifies is rejected; vendor output is never a reference (DB-07)."
enforced_by = "Reference.implementation != Reference.verifies; vendor_output rejected. RES-669 adds an import-boundary test between generators and engines."

[[principle]]
id = "QP-05"
text = "Processing methods must suit the family's paradigm. Continuous-signal filtering is not applied to discrete timing or contact events."
enforced_by = "processing_method.paradigms check."

[[principle]]
id = "QP-06"
text = "Measurements from different devices are different estimands until an agreement study rules otherwise. Examples: GNSS-derived speed is not a radar velocity trace; LPT cable displacement is not vertical displacement without geometry; commercial force, torque, velocity, power and RFD definitions are not interchangeable between vendors."
enforced_by = "non_equivalence entries need a study; an interchangeable or convertible verdict needs evidence and a basis."

[[principle]]
id = "QP-07"
text = "Three engines are kept separate: the device processing engine (how an instrument produces observations), the assessment science engine (how a protocol produces scientific quantities) and the AI benchmark engine (how an AI system is evaluated on that work)."
enforced_by = "Families own dimensions A-F and I-M; assessment engines own G-H; M4/M5 own N."

[[principle]]
id = "QP-08"
text = "M3 is complete only when every in-scope family computes ENGINEERING_VERIFIED. Families that cannot are reported as blocked, never silently removed from scope. SCIENTIFICALLY_QUALIFIED needs independent review (M8) and qualified grading (N)."
enforced_by = "dbs qualification gate."

[[principle]]
id = "QP-09"
text = "Project constraints: at least two atomic commits per issue, independent verification, explicit scientific assumptions, qualified data provenance, no paid model evaluations, and no modifications to DynamisSimBench."
enforced_by = "Review policy (not machine-checked)."

# --------------------------------------------------------------------------------------
# Processing-method catalogue (dimension E). Families may only use methods valid for
# their paradigm.

[[processing_method]]
id = "raw_passthrough"
paradigms = ["continuous_signal", "position_track", "inertial"]
description = "No filtering; the documented default for impulse-based force metrics."

[[processing_method]]
id = "butterworth_zero_lag"
paradigms = ["continuous_signal", "position_track", "inertial"]
description = "Low-pass Butterworth, forward-backward, order and cutoff declared."

[[processing_method]]
id = "chebyshev_zero_lag"
paradigms = ["continuous_signal"]
description = "Low-pass Chebyshev type I, forward-backward."

[[processing_method]]
id = "moving_average"
paradigms = ["continuous_signal", "position_track", "inertial"]
description = "Centred moving average, window declared."

[[processing_method]]
id = "trapezoid_integration"
paradigms = ["continuous_signal", "inertial"]
description = "Trapezoidal numerical integration."

[[processing_method]]
id = "simpson_integration"
paradigms = ["continuous_signal", "inertial"]
description = "Composite Simpson integration."

[[processing_method]]
id = "finite_difference"
paradigms = ["continuous_signal", "position_track"]
description = "Central finite-difference differentiation."

[[processing_method]]
id = "spline_differentiation"
paradigms = ["continuous_signal", "position_track"]
description = "Smoothing-spline fit, then analytic derivative."

[[processing_method]]
id = "cosine_correction"
paradigms = ["continuous_signal"]
description = "Correct line-of-sight radar or laser measurements for mounting geometry."

[[processing_method]]
id = "event_debounce_refractory"
paradigms = ["discrete_event"]
description = "Suppress repeated triggers inside a declared refractory window."

[[processing_method]]
id = "multi_beam_voting"
paradigms = ["discrete_event"]
description = "Accept a gate event only when the declared beams agree."

[[processing_method]]
id = "contact_pairing"
paradigms = ["discrete_event"]
description = "Pair contact on/off events into contact and flight phases."

[[processing_method]]
id = "trigger_latency_correction"
paradigms = ["discrete_event"]
description = "Apply a declared start-trigger or switching-latency offset."

[[processing_method]]
id = "position_projection_local"
paradigms = ["position_track"]
description = "Project WGS-84 positions to a declared local tangent-plane or pitch frame."

[[processing_method]]
id = "doppler_speed_passthrough"
paradigms = ["position_track"]
description = "Keep device-reported Doppler speed as its own estimand."

[[processing_method]]
id = "orientation_complementary"
paradigms = ["inertial"]
description = "Complementary-filter orientation estimate."

[[processing_method]]
id = "orientation_kalman"
paradigms = ["inertial"]
description = "Kalman-filter orientation estimate."

[[processing_method]]
id = "gravity_removal"
paradigms = ["inertial"]
description = "Remove gravity from specific force using the estimated orientation."

